<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin Paylaşım & Okuma Sistemi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 850px; width: 100%; background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); height: fit-content; }
        
        /* EDITÖR MODU BÖLÜMÜ */
        .header-title { color: #38bdf8; font-size: 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        textarea { width: 100%; height: 280px; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 16px; border-radius: 12px; font-size: 16px; line-height: 1.6; margin-bottom: 16px; outline: none; resize: vertical; font-family: monospace; }
        textarea:focus { border-color: #38bdf8; }
        
        .action-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn:hover { background: #0369a1; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: transparent; border: 1px solid #334155; }
        .btn-outline:hover { background: #334155; }

        .share-box { margin-top: 18px; background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; display: none; }
        .share-box input { width: calc(100% - 110px); padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #38bdf8; font-weight: 500; outline: none; }

        /* SADECE OKUMA (AYRI SAYFA) MODU */
        #viewSection { display: none; }
        .view-card { background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #334155; min-height: 200px; font-size: 17px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; color: #e2e8f0; }
        .view-footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. YAZMA / EDITÖR MODU -->
    <div id="editorSection">
        <div class="header-title">
            <i class="fa-solid fa-pen-to-square"></i> Metin Düzenleyici
        </div>
        
        <textarea id="editor" placeholder="Metninizi buraya yazın veya yapıştırın..."></textarea>
        
        <div class="action-bar">
            <button class="btn btn-success" onclick="generateShareLink()">
                <i class="fa-solid fa-bolt"></i> Özel Link Oluştur & Kopyala
            </button>
            <button class="btn btn-outline" onclick="document.getElementById('editor').value=''">
                <i class="fa-solid fa-trash"></i> Temizle
            </button>
        </div>

        <div class="share-box" id="shareBox">
            <p style="margin-bottom:8px; font-size:13px; color:#94a3b8;">Paylaşılmaya Hazır Özel Linkiniz:</p>
            <div style="display:flex; gap:8px;">
                <input type="text" id="shareUrl" readonly>
                <button class="btn" onclick="copyLink()">
                    <i class="fa-solid fa-copy"></i> Kopyala
                </button>
            </div>
        </div>
    </div>

    <!-- 2. LİNKE TIKLAYANIN GÖRECEĞİ AYRI SAYFA MODU -->
    <div id="viewSection">
        <div class="header-title">
            <i class="fa-solid fa-file-lines"></i> Paylaşılan İçerik
        </div>
        
        <div class="view-card" id="textContent"></div>
        
        <div class="view-footer">
            <button class="btn btn-outline" onclick="copyContent()">
                <i class="fa-solid fa-copy"></i> Metni Kopyala
            </button>
            <a href="index.html" class="btn" style="text-decoration:none;">
                <i class="fa-solid fa-plus"></i> Kendi Metnini Oluştur
            </a>
        </div>
    </div>

</div>

<script>
    // Sayfa Yüklendiğinde Kontrol Et
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash.substring(1);
        
        // Eğer linkin sonunda metin verisi (#...) varsa AYRI OKUMA SAYFASINI AÇ
        if (hash) {
            try {
                const decodedText = decodeURIComponent(escape(atob(hash)));
                
                // Editör alanını gizle, Sadece Okuma sayfasını göster
                document.getElementById('editorSection').style.display = 'none';
                document.getElementById('viewSection').style.display = 'block';
                document.getElementById('textContent').textContent = decodedText;
            } catch (e) {
                alert('Geçersiz veya bozuk paylaşım linki!');
            }
        }
    });

    // Metne Özel Link Üretme Fonksiyonu
    function generateShareLink() {
        const text = document.getElementById('editor').value;
        if (!text.trim()) {
            alert('Lütfen önce bir metin yazın!');
            return;
        }

        // Metni URL için güvenli şekilde kodla (Base64)
        const encodedText = btoa(unescape(encodeURIComponent(text)));
        const fullUrl = window.location.origin + window.location.pathname + '#' + encodedText;

        // Input'a yaz ve Panoya Kopyala
        document.getElementById('shareUrl').value = fullUrl;
        document.getElementById('shareBox').style.display = 'block';
        
        navigator.clipboard.writeText(fullUrl).then(() => {
            alert('Özel linkiniz oluşturuldu ve panoya kopyalandı!\n\nArtık bu linki herkese gönderebilirsiniz.');
        }).catch(() => {
            alert('Link oluşturuldu! Aşağıdaki kutudan kopyalayabilirsiniz.');
        });
    }

    function copyLink() {
        const copyText = document.getElementById('shareUrl');
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert('Link kopyalandı!');
    }

    function copyContent() {
        const text = document.getElementById('textContent').textContent;
        navigator.clipboard.writeText(text);
        alert('Metin panoya kopyalandı!');
    }
</script>

</body>
</html>
