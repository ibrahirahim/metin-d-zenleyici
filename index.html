<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metinlerim - Editör Pro Cloud</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --panel: #111827; --border: #1f2937; --accent: #6366f1; --danger: #ef4444; --text: #f9fafb; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        
        /* Editör & Liste Kontrolü */
        #editorView { display: none; }
        
        .doc-item { display: flex; justify-content: space-between; align-items: center; background: #080c14; padding: 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sec { background: var(--border); color: white; }
        
        input, textarea { width: 100%; padding: 12px; background: #080c14; border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 10px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="authSection">
        <div class="card" id="loginForm">
            <h2>Giriş Yap</h2>
            <input type="email" id="loginEmail" placeholder="E-posta">
            <input type="password" id="loginPassword" placeholder="Şifre">
            <button class="btn btn-primary" onclick="login()">Giriş Yap</button>
        </div>
    </div>

    <div id="appSection" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Metinlerim</h1>
            <button class="btn btn-primary" onclick="showEditor()"><i class="fa-solid fa-plus"></i> Yeni Metin</button>
        </div>

        <!-- Klasör Görünümü -->
        <div id="documentsView">
            <div id="documentsContainer"></div>
        </div>

        <!-- Editör Görünümü -->
        <div id="editorView" class="card">
            <h2 id="editorTitle">Yeni Metin</h2>
            <input type="hidden" id="currentDocId">
            <input type="text" id="docTitle" placeholder="Başlık...">
            <textarea id="docContent" rows="10" placeholder="İçerik..."></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="saveDocument()">Kaydet</button>
                <button class="btn btn-sec" onclick="hideEditor()">İptal</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfOIZT3dkDbWaVqOuwaLWT8JrsVqhWiKw",
        authDomain: "tv-go-test-c8ae3.firebaseapp.com",
        databaseURL: "https://tv-go-test-c8ae3-default-rtdb.firebaseio.com",
        projectId: "tv-go-test-c8ae3",
        storageBucket: "tv-go-test-c8ae3.firebasestorage.app",
        messagingSenderId: "913761505448",
        appId: "1:913761505448:web:b4d8aa53502066ef7cb29d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    let uid = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            uid = user.uid;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            loadDocs();
        }
    });

    window.login = () => {
        const e = document.getElementById('loginEmail').value;
        const p = document.getElementById('loginPassword').value;
        signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
    };

    window.showEditor = (id, title, content) => {
        document.getElementById('currentDocId').value = id || '';
        document.getElementById('docTitle').value = title || '';
        document.getElementById('docContent').value = content || '';
        document.getElementById('editorTitle').innerText = id ? 'Düzenle' : 'Yeni Metin';
        document.getElementById('documentsView').style.display = 'none';
        document.getElementById('editorView').style.display = 'block';
    };

    window.hideEditor = () => {
        document.getElementById('documentsView').style.display = 'block';
        document.getElementById('editorView').style.display = 'none';
    };

    window.saveDocument = async () => {
        const id = document.getElementById('currentDocId').value;
        const title = document.getElementById('docTitle').value;
        const content = document.getElementById('docContent').value;
        
        if (id) {
            await update(ref(db, `users/${uid}/docs/${id}`), { title, content });
        } else {
            await push(ref(db, `users/${uid}/docs`), { title, content });
        }
        hideEditor();
    };

    window.deleteDoc = (id) => {
        if(confirm('Silinsin mi?')) remove(ref(db, `users/${uid}/docs/${id}`));
    };

    function loadDocs() {
        onValue(ref(db, `users/${uid}/docs`), (snap) => {
            const container = document.getElementById('documentsContainer');
            container.innerHTML = '';
            snap.forEach(child => {
                const d = child.val();
                container.innerHTML += `
                    <div class="doc-item">
                        <div><strong>${d.title}</strong></div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn btn-sec" onclick="showEditor('${child.key}', '${d.title.replace(/'/g, "\\'")}', '${d.content.replace(/'/g, "\\'")}')">Düzenle</button>
                            <button class="btn btn-danger" onclick="deleteDoc('${child.key}')">Sil</button>
                        </div>
                    </div>`;
            });
        });
    }
</script>

</body>
</html>
