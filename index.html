<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Sayfalı Metin Görünümü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .page-content { background: #0f172a; padding: 16px; border-radius: 8px; min-height: 200px; white-space: pre-wrap; font-size: 16px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: white; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .share-btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Sayfalı Metin Düzenleyici</h2>
    <p style="color:#94a3b8; font-size:14px; margin-bottom:12px;">Metin aralarına <b>---</b> koyarak metni farklı sayfalara bölebilirsin.</p>

    <textarea id="editor" placeholder="1. Sayfa Metni&#10;---&#10;2. Sayfa Metni&#10;---&#10;3. Sayfa Metni" oninput="renderPages()"></textarea>

    <div class="tabs" id="tabContainer"></div>
    <div class="page-content" id="pageDisplay">Metin yazıldığında ayrı sayfalar burada görünecek...</div>

    <br>
    <button class="share-btn" onclick="copyShareLink()">📋 Herkesle Paylaşılabilir Linki Kopyala</button>
</div>

<script>
    function renderPages() {
        const text = document.getElementById('editor').value;
        const pages = text.split('---');
        const tabContainer = document.getElementById('tabContainer');
        const pageDisplay = document.getElementById('pageDisplay');

        tabContainer.innerHTML = '';

        if (!text.trim()) {
            pageDisplay.textContent = 'Metin girilmedi...';
            return;
        }

        pages.forEach((pageText, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = `Sayfa ${index + 1}`;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                pageDisplay.textContent = pageText.trim();
            };
            tabContainer.appendChild(btn);
        });

        pageDisplay.textContent = pages[0].trim();
    }

    function copyShareLink() {
        navigator.clipboard.writeText(window.location.href);
        alert('Bağlantı kopyalandı! Bu linki herkese gönderebilirsin.');
    }
</script>

</body>
</html>
