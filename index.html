<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editör Pro - Metin & Kod Paylaşım Platformu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --panel-bg: #111827;
            --panel-border: #1f2937;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .app-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* BODY / EDITOR */
        .app-body {
            padding: 24px;
        }

        .editor-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 320px;
            background: #080c14;
            color: #e5e7eb;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 18px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        /* ACTION BAR */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* SHARE BOX */
        .share-box {
            margin-top: 20px;
            background: #080c14;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .share-input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .share-input-group input {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--accent);
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            outline: none;
        }

        /* VIEW MODE (AYRI SAYFA MODU) */
        #viewSection { display: none; }

        .view-card {
            background: #080c14;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 24px;
            min-height: 250px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e5e7eb;
        }

        /* STATUS BAR FOOTER */
        .status-bar {
            padding: 10px 24px;
            background: rgba(8, 12, 20, 0.6);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stats-group {
            display: flex;
            gap: 16px;
        }

        @media (max-width: 640px) {
            .action-bar { flex-direction: column; width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .share-input-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- HEADER -->
    <div class="app-header">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-code"></i>
            </div>
            <span>Editör Pro</span>
        </div>
        <span class="badge"><i class="fa-solid fa-globe"></i> Canlı Yayın</span>
    </div>

    <!-- MAIN BODY -->
    <div class="app-body">
        
        <!-- 1. DÜZENLEME MODU -->
        <div id="editorSection">
            <div class="editor-wrapper">
                <textarea id="editor" placeholder="Metninizi veya kod parçacığınızı buraya yazın..." oninput="updateStats()"></textarea>
            </div>
            
            <div class="action-bar">
                <button class="btn" onclick="generateShareLink()">
                    <i class="fa-solid fa-bolt"></i> Özel Bağlantı Oluştur & Kopyala
                </button>
                <button class="btn btn-secondary" onclick="clearEditor()">
                    <i class="fa-solid fa-trash-can"></i> Temizle
                </button>
            </div>

            <div class="share-box" id="shareBox">
                <p style="font-size: 0.85rem; color: var(--text-muted);">Paylaşıma Hazır Bağlantınız:</p>
                <div class="share-input-group">
                    <input type="text" id="shareUrl" readonly>
                    <button class="btn" onclick="copyLink()">
                        <i class="fa-solid fa-copy"></i> Kopyala
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. SADECE OKUMA (AYRI SAYFA) MODU -->
        <div id="viewSection">
            <div style="margin-bottom: 14px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-file-contract"></i> Paylaşılan İçerik Görünümü
            </div>
            
            <div class="view-card" id="textContent"></div>
            
            <div class="action-bar" style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="copyContent()">
                    <i class="fa-solid fa-copy"></i> İçeriği Kopyala
                </button>
                <a href="index.html" class="btn" style="text-decoration: none;">
                    <i class="fa-solid fa-plus"></i> Yeni Metin Oluştur
                </a>
            </div>
        </div>

    </div>

    <!-- FOOTER STATUS BAR -->
    <div class="status-bar">
        <div class="stats-group">
            <span id="charCount">Karakter: 0</span>
            <span id="wordCount">Kelime: 0</span>
            <span id="lineCount">Satır: 0</span>
        </div>
        <div>UTF-8</div>
    </div>

</div>

<script>
    const editor = document.getElementById('editor');

    // İstatistikleri Güncelle
    function updateStats() {
        const text = editor.value;
        document.getElementById('charCount').textContent = `Karakter: ${text.length}`;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById('wordCount').textContent = `Kelime: ${words}`;
        const lines = text ? text.split('\n').length : 0;
        document.getElementById('lineCount').textContent = `Satır: ${lines}`;
    }

    // Yükleme Kontrolü
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash.substring(1);
        if (hash) {
            try {
                const decodedText = decodeURIComponent(escape(atob(hash)));
                document.getElementById('editorSection').style.display = 'none';
                document.getElementById('viewSection').style.display = 'block';
                document.getElementById('textContent').textContent = decodedText;
                
                // Okuma modunda istatistikleri ayarla
                document.getElementById('charCount').textContent = `Karakter: ${decodedText.length}`;
                const words = decodedText.trim() ? decodedText.trim().split(/\s+/).length : 0;
                document.getElementById('wordCount').textContent = `Kelime: ${words}`;
                const lines = decodedText ? decodedText.split('\n').length : 0;
                document.getElementById('lineCount').textContent = `Satır: ${lines}`;
            } catch (e) {
                alert('Geçersiz veya bozuk link!');
            }
        }
    });

    // Link Üret
    function generateShareLink() {
        const text = editor.value;
        if (!text.trim()) {
            alert('Lütfen önce bir metin girin!');
            return;
        }

        const encodedText = btoa(unescape(encodeURIComponent(text)));
        const fullUrl = window.location.origin + window.location.pathname + '#' + encodedText;

        document.getElementById('shareUrl').value = fullUrl;
        document.getElementById('shareBox').style.display = 'block';
        
        navigator.clipboard.writeText(fullUrl).then(() => {
            alert('Özel bağlantınız oluşturuldu ve kopyalandı!');
        }).catch(() => {});
    }

    function copyLink() {
        const copyText = document.getElementById('shareUrl');
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert('Bağlantı kopyalandı!');
    }

    function copyContent() {
        const text = document.getElementById('textContent').textContent;
        navigator.clipboard.writeText(text);
        alert('İçerik kopyalandı!');
    }

    function clearEditor() {
        if(confirm('Tüm metni silmek istediğinize emin misiniz?')) {
            editor.value = '';
            updateStats();
            document.getElementById('shareBox').style.display = 'none';
        }
    }
</script>

</body>
</html>
