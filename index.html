<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Editör Pro - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --sidebar: #111827; --accent: #6366f1; --text: #f9fafb; --border: #1f2937; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .auth-card { width: 350px; padding: 30px; background: var(--sidebar); border-radius: 16px; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .doc-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .doc-item:hover { background: var(--border); }
        
        /* Main Editor */
        #main-area { flex: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; }
        input, textarea { width: 100%; padding: 12px; background: #080c14; border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 15px; outline: none; }
        textarea { height: 400px; resize: none; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: #ef4444; color: white; }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="auth-screen">
    <div class="auth-card">
        <h2 style="margin-bottom:20px;">Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button class="btn btn-primary" style="width:100%" onclick="login()">Giriş Yap</button>
    </div>
</div>

<!-- UYGULAMA EKRANI -->
<div id="sidebar">
    <div class="sidebar-header">Metinlerim <button class="btn" onclick="newDoc()">+</button></div>
    <div id="doc-list"></div>
</div>

<div id="main-area">
    <input type="hidden" id="activeId">
    <input type="text" id="title" placeholder="Başlık...">
    <textarea id="content" placeholder="Metin içeriği..."></textarea>
    
    <div class="toolbar">
        <button class="btn btn-primary" onclick="saveDoc()"><i class="fa-solid fa-save"></i> Kaydet</button>
        <button class="btn btn-danger" onclick="deleteDoc()"><i class="fa-solid fa-trash"></i> Sil</button>
        <div style="flex:1"></div>
        <button class="btn" onclick="openShareModal()">Paylaşım Linki Oluştur</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAfOIZT3dkDbWaVqOuwaLWT8JrsVqhWiKw",
        authDomain: "tv-go-test-c8ae3.firebaseapp.com",
        databaseURL: "https://tv-go-test-c8ae3-default-rtdb.firebaseio.com",
        projectId: "tv-go-test-c8ae3",
        storageBucket: "tv-go-test-c8ae3.firebasestorage.app",
        messagingSenderId: "913761505448",
        appId: "1:913761505448:web:b4d8aa53502066ef7cb29d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    let uid = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            uid = user.uid;
            document.getElementById('auth-screen').style.display = 'none';
            loadList();
        }
    });

    window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);

    // DOKÜMAN YÖNETİMİ
    window.newDoc = () => {
        document.getElementById('activeId').value = "";
        document.getElementById('title').value = "";
        document.getElementById('content').value = "";
    };

    window.saveDoc = async () => {
        const id = document.getElementById('activeId').value;
        const data = { title: document.getElementById('title').value, content: document.getElementById('content').value };
        if(id) await update(ref(db, `users/${uid}/docs/${id}`), data);
        else {
            const newRef = push(ref(db, `users/${uid}/docs`));
            await set(newRef, data);
            document.getElementById('activeId').value = newRef.key;
        }
        alert('Kaydedildi');
    };

    window.deleteDoc = async () => {
        const id = document.getElementById('activeId').value;
        if(id && confirm('Silinsin mi?')) {
            await remove(ref(db, `users/${uid}/docs/${id}`));
            newDoc();
        }
    };

    window.loadList = () => {
        onValue(ref(db, `users/${uid}/docs`), (snap) => {
            const list = document.getElementById('doc-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const d = child.val();
                list.innerHTML += `<div class="doc-item" onclick="editDoc('${child.key}', '${d.title.replace(/'/g, "\\'")}', '${d.content.replace(/'/g, "\\'")}')">
                    ${d.title}</div>`;
            });
        });
    };

    window.editDoc = (id, title, content) => {
        document.getElementById('activeId').value = id;
        document.getElementById('title').value = title;
        document.getElementById('content').value = content;
    };

    // PAYLAŞIM (SÜRE VE ŞİFRE EKLEME)
    window.openShareModal = () => {
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const pass = prompt("Paylaşım için şifre belirleyin:");
        const expiry = prompt("Süre (saniye cinsinden, örn: 3600):");
        
        const payload = { c: content, p: pass, t: Date.now(), d: parseInt(expiry) };
        const encoded = btoa(JSON.stringify(payload));
        const url = window.location.origin + "/view.html#" + encoded;
        prompt("Paylaşım linkiniz (Bunu kopyalayın):", url);
    };
</script>

</body>
</html>
